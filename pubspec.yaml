name: astroresilience
description: "AstroResilience OS — offline edge health system for astronauts on long missions."
# Private hackathon app: never published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Approved packages only (see CLAUDE.md section 2).
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  fl_chart: ^1.3.1
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Everything is bundled: the app makes ZERO network calls at runtime.
  assets:
    - assets/images/
    - assets/data/
    - assets/data/nasa/

  # IBM Plex fonts bundled locally (SIL Open Font License, see assets/fonts/OFL.txt).
  # We do NOT use the google_fonts package because it downloads fonts at runtime.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    # Offline trick: if no font called "Roboto" is bundled, Flutter web
    # downloads Roboto from fonts.gstatic.com at startup. Registering a local
    # font under that name (we reuse Plex Sans) keeps the app 100% offline.
    - family: Roboto
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf

# App icons (run: dart run flutter_launcher_icons). The source PNGs live in
# assets/icon/ and are NOT bundled in the app (not in the assets list above):
# they are only read by the icon generator.
flutter_launcher_icons:
  android: true
  ios: false
  # Legacy (pre-Android 8) launcher icon and the web icons: the full logo.
  image_path: "assets/icon/app_icon.png"
  # Adaptive icon (Android 8+). WHY a separate, padded foreground: the logo
  # artwork reaches the bottom edge of the square, and launchers cut adaptive
  # icons with a circle / squircle mask. app_icon_foreground.png already has
  # the artwork scaled inside the central 66% safe zone, so nothing is cut.
  adaptive_icon_background: "#111011"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#121314"
    theme_color: "#E8743B"
